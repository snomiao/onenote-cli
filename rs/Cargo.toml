[package]
name = "onenote-cli"
version = "0.0.0"
edition = "2021"
description = "Make your OneNote notebooks survive in the age of AI"
license = "MIT"

[[bin]]
name = "onenote-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Only the search needs these, and the search is ported for Linux and macOS
# only (see src/main.rs), so Windows builds without them, and without C.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Local time for "last synced" and --since. The zone data is compiled in, as
# the JavaScript runtime carries its own (ICU's): the answer then does not
# depend on which zone files a machine has installed.
jiff = { version = "1.0.3", features = ["tzdb-bundle-always"] }
# The search index is an SQLite file with an FTS5 table. SQLite is compiled
# in (C, no system library), so every Linux and every Mac reads it the same
# way.
rusqlite = { version = "0.43.0", features = ["bundled"] }
# JSON.parse for the tag lines stored in the index.
serde_json = "1.0.154"
